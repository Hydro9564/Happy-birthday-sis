<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday, Sister! ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.4);
            --accent: #ffa502;
            --bg-dark: #09090e;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fullscreen Interactive Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Initial Interactive Envelope Container */
        .envelope-wrapper {
            position: relative;
            z-index: 10;
            cursor: pointer;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .envelope-wrapper:active {
            transform: scale(0.95);
        }

        .envelope {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5rem;
            margin: 0 auto 20px;
            box-shadow: 0 15px 35px var(--primary-glow), inset 0 0 15px rgba(255,255,255,0.3);
            animation: floatPulse 2s infinite ease-in-out;
        }

        @keyframes floatPulse {
            0%, 100% { transform: translateY(0) scale(1); box-shadow: 0 15px 35px var(--primary-glow); }
            50% { transform: translateY(-10px) scale(1.03); box-shadow: 0 25px 45px rgba(255, 71, 87, 0.6); }
        }

        .tap-hint {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff6b81, #ffa502, #ff6b81);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Main Glass Card (Hidden initially) */
        .card {
            display: none;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 5;
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card.active {
            display: block;
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #ff6b81;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff 30%, #a0a0b2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #8a8a9e;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Letter Container */
        .letter-content {
            text-align: left;
            line-height: 1.75;
            color: #dcdce6;
            font-size: 0.95rem;
            min-height: 240px;
            background: rgba(0, 0, 0, 0.25);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 24px;
            position: relative;
        }

        .letter-content::after {
            content: '|';
            color: var(--primary);
            animation: blink 0.8s infinite;
        }

        .letter-content.done::after {
            display: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Controller Buttons */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #ff6b81);
            border: none;
            box-shadow: 0 10px 25px var(--primary-glow);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Tap to Open Envelope Screen -->
    <div class="envelope-wrapper" id="envelope-screen" onclick="openSurprise()">
        <div class="envelope">💌</div>
        <div class="tap-hint">Tap to Open Surprise</div>
    </div>

    <!-- Main Card Screen -->
    <div class="card" id="main-card">
        <span class="badge">Special Greeting</span>
        <h1>Happy Birthday! 🎉</h1>
        <div class="subtitle">To my sister from another mother</div>

        <div class="letter-content" id="typed-text"></div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="triggerCelebration()">
                ✨ Celebrate More
            </button>
            <button class="btn" onclick="toggleAudio()" id="audio-btn">
                🎵 Mute
            </button>
        </div>
    </div>

    <!-- Ambient Audio Track -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-ambient-111154.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Interactive Canvas Particle Engine
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 107, 129, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Message Script
        const textMessage = `Dearest Sister,\n\nThey say that blood makes you related, but loyalty, shared laughter, and genuine care make you family. You might be my sister from another mother, but in every single way that truly matters, you are as real a sister as anyone could ever have.\n\nI don’t need childhood photo albums or shared last names to prove how much you mean to me. The way you listen when things get heavy, the effortless joy in our random conversations, and the quiet comfort of knowing you’re always in my corner—that is real family.\n\nOn your birthday, I want you to know how deeply appreciated and valued you are. Keep shining, stay your incredible self, and remember that no matter where life takes us, you will always have a brother who stands by you. ✨`;

        let charIndex = 0;
        const textContainer = document.getElementById("typed-text");
        const audio = document.getElementById("bg-music");

        function openSurprise() {
            // Hide envelope screen
            document.getElementById("envelope-screen").style.display = "none";
            
            // Show main card with animation
            const card = document.getElementById("main-card");
            card.classList.add("active");

            // Play music & trigger confetti
            audio.play().catch(() => {});
            triggerCelebration();

            // Start Typing
            setTimeout(typeEffect, 400);
        }

        function typeEffect() {
            if (charIndex < textMessage.length) {
                let char = textMessage.charAt(charIndex);
                textContainer.innerHTML += char === '\n' ? '<br>' : char;
                charIndex++;
                setTimeout(typeEffect, 30);
            } else {
                textContainer.classList.add("done");
            }
        }

        function triggerCelebration() {
            // Multi-stage fireworks bursts
            const count = 200;
            const defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff4757', '#ffa502'] });
            fire(0.2, { spread: 60, colors: ['#ffffff', '#ff6b81'] });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, colors: ['#ffeaa7'] });
        }

        let isMuted = false;
        function toggleAudio() {
            if (isMuted) {
                audio.play();
                document.getElementById("audio-btn").innerText = "🎵 Mute";
                isMuted = false;
            } else {
                audio.pause();
                document.getElementById("audio-btn").innerText = "🔇 Unmute";
                isMuted = true;
            }
        }
    </script>
</body>
</html>
