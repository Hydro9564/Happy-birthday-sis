<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultron AI Interface - Neural Network 3D</title>
    <!-- Three.js WebGL Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00f0ff;
            --cyan-glow: rgba(0, 240, 255, 0.4);
            --ultron-blue: #0052d4;
            --bg-dark: #03060e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 3D WebGL Canvas */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD Overlay Header */
        .hud-header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--cyan);
        }

        .hud-header p {
            font-size: 0.8rem;
            color: rgba(0, 240, 255, 0.7);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* System Telemetry HUD (Top Right) */
        .hud-telemetry {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            text-align: right;
            font-size: 0.75rem;
            color: rgba(0, 240, 255, 0.7);
            line-height: 1.5;
            pointer-events: none;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--cyan);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--cyan);
            animation: pulse 1.5s infinite ease-in-out;
            margin-right: 6px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Control Panel (Bottom) */
        .hud-controls {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
            background: rgba(3, 10, 25, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 10px 18px;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--cyan);
            font-family: 'Share Tech Mono', monospace;
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover, .btn.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--cyan);
            box-shadow: 0 0 12px var(--cyan-glow);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Vignette and Grid Overlay */
        .overlay-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle, transparent 40%, rgba(3, 6, 14, 0.85) 90%),
                        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }
    </style>
</head>
<body>

    <div class="overlay-grid"></div>

    <div id="canvas-container"></div>

    <div class="hud-header">
        <h1>Ultron Matrix</h1>
        <p>Neural Consciousness // Core Model v0.9</p>
    </div>

    <div class="hud-telemetry">
        <div><span class="status-dot"></span>SYSTEM: ONLINE</div>
        <div>NODES: 420 ACTIVE</div>
        <div>SYNC RATE: 99.84%</div>
    </div>

    <div class="hud-controls">
        <button class="btn" onclick="toggleRotation()" id="btn-rotate">Pause Motion</button>
        <button class="btn" onclick="toggleCorePulse()" id="btn-pulse">Core Surge</button>
        <button class="btn" onclick="toggleWireframe()" id="btn-wire">Wireframe</button>
    </div>

    <script>
        // --- THREE.JS ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const ultronGroup = new THREE.Group();
        scene.add(ultronGroup);

        // 1. Outer Geodesic Hologram Shell
        const outerGeo = new THREE.IcosahedronGeometry(2.4, 2);
        const outerMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            wireframe: true,
            transparent: true,
            opacity: 0.25
        });
        const outerShell = new THREE.Mesh(outerGeo, outerMat);
        ultronGroup.add(outerShell);

        // 2. Middle Dense Connectivity Lattice
        const midGeo = new THREE.IcosahedronGeometry(1.7, 3);
        const midMat = new THREE.MeshBasicMaterial({
            color: 0x0088ff,
            wireframe: true,
            transparent: true,
            opacity: 0.18
        });
        const midShell = new THREE.Mesh(midGeo, midMat);
        ultronGroup.add(midShell);

        // 3. Neural Node Particle Cloud
        const particleCount = 380;
        const particleGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = 1.3 + Math.random() * 1.1;

            positions[i] = r * Math.sin(phi) * Math.cos(theta);
            positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
            positions[i + 2] = r * Math.cos(phi);
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00f0ff,
            size: 0.05,
            transparent: true,
            opacity: 0.85
        });
        const particleSystem = new THREE.Points(particleGeo, particleMat);
        ultronGroup.add(particleSystem);

        // 4. Central High-Density Core
        const coreGeo = new THREE.IcosahedronGeometry(0.85, 2);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x0052d4,
            wireframe: true,
            transparent: true,
            opacity: 0.65
        });
        const innerCore = new THREE.Mesh(coreGeo, coreMat);
        ultronGroup.add(innerCore);

        // 5. Inner Core Solid Kernel
        const kernelGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const kernelMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.9
        });
        const kernel = new THREE.Mesh(kernelGeo, kernelMat);
        ultronGroup.add(kernel);

        camera.position.z = 5.2;

        // --- INTERACTIVE TOUCH/MOUSE CONTROL ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        function onPointerDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX || e.touches[0].clientX, y: e.clientY || e.touches[0].clientY };
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            ultronGroup.rotation.y += deltaX * 0.005;
            ultronGroup.rotation.x += deltaY * 0.005;

            previousMousePosition = { x: clientX, y: clientY };
        }

        function onPointerUp() { isDragging = false; }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown);
        window.addEventListener('touchmove', onPointerMove);
        window.addEventListener('touchend', onPointerUp);

        // --- ANIMATION LOOP ---
        let clock = new THREE.Clock();
        let isRotating = true;
        let surgeMode = false;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getElapsedTime();

            if (isRotating && !isDragging) {
                outerShell.rotation.y = delta * 0.12;
                outerShell.rotation.x = delta * 0.06;

                midShell.rotation.y = -delta * 0.18;
                particleSystem.rotation.y = delta * 0.15;
                particleSystem.rotation.z = -delta * 0.05;

                innerCore.rotation.y = -delta * 0.3;
                innerCore.rotation.x = delta * 0.15;
            }

            // Core Pulse Dynamics
            const speed = surgeMode ? 8 : 2.5;
            const scaleAmount = surgeMode ? 0.22 : 0.08;
            const coreScale = 1 + Math.sin(delta * speed) * scaleAmount;
            
            innerCore.scale.set(coreScale, coreScale, coreScale);
            kernel.scale.set(coreScale * 0.8, coreScale * 0.8, coreScale * 0.8);

            renderer.render(scene, camera);
        }
        animate();

        // --- HUD CONTROL FUNCTIONS ---
        function toggleRotation() {
            isRotating = !isRotating;
            document.getElementById('btn-rotate').classList.toggle('active', !isRotating);
            document.getElementById('btn-rotate').innerText = isRotating ? 'Pause Motion' : 'Resume Motion';
        }

        function toggleCorePulse() {
            surgeMode = !surgeMode;
            document.getElementById('btn-pulse').classList.toggle('active', surgeMode);
            document.getElementById('btn-pulse').innerText = surgeMode ? 'Normal Core' : 'Core Surge';
        }

        function toggleWireframe() {
            const isWire = outerShell.material.wireframe;
            outerShell.material.wireframe = !isWire;
            midShell.material.wireframe = !isWire;
            innerCore.material.wireframe = !isWire;
            document.getElementById('btn-wire').classList.toggle('active', !isWire);
        }

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
